<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gemini + Jev automatic-routing AI chatbot">
  <title>Gemini + Jev AI Chatbot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="chat-card" aria-label="AI chatbot">
      <header class="chat-header">
        <div>
          <p class="eyebrow">AI ASSISTANT</p>
          <h1>Gemini + Jev</h1>
          <p class="subtitle">Ask anything. The backend automatically chooses the right AI.</p>
        </div>
        <span class="status" id="status">Ready</span>
      </header>

      <div class="messages" id="messages" aria-live="polite">
        <div class="message assistant">
          <div class="bubble">
            <p>Hello! Ask me a normal question, or give me something that needs a decision.</p>
          </div>
          <span class="meta">AI</span>
        </div>
      </div>

      <form class="composer" id="chatForm">
        <textarea id="messageInput" rows="1" maxlength="8000"
          placeholder="Type your message..." autocomplete="off" required></textarea>
        <button id="sendButton" type="submit" aria-label="Send message">Send</button>
      </form>

      <footer class="chat-footer">
        <span id="routeInfo">Automatic routing enabled</span>
        <button class="clear-btn" id="clearButton" type="button">Clear chat</button>
      </footer>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
